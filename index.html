<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- FIXED -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Example</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">MyApp</a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- COLUMNS -->
    <div class="container mt-5">

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-primary text-white p-3 text-center rounded">
                    Column 1
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-success text-white p-3 text-center rounded">
                    Column 2
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-warning p-3 text-center rounded">
                    Column 3
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-danger text-white p-3 text-center rounded">
                    Column 4
                </div>
            </div>

        </div>

        <!-- FORM -->
        <form class="mt-5">

            <div class="mb-3">

                <label for="exampleInputEmail1" class="form-label">
                    Email address
                </label>

                <input type="email"
                       class="form-control"
                       id="exampleInputEmail1">

                <div class="form-text">
                    We'll never share your email with anyone else.
                </div>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
